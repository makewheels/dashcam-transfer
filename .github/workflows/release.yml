name: 发布安装包
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        # 浅克隆会丢失 annotated tag 对象，读不到 tag 说明；完整取回。
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: astral-sh/setup-uv@v6
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: 获取受限发行凭据
        run: uv run --project deploy deploy/ci_secrets.py
        env:
          INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
      - name: 构建、签名并发布到私有 OSS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          task_dir=$(mktemp -d "${TMPDIR:-/tmp}/transfer-release.XXXXXX")
          trap 'rm -rf "$task_dir"' EXIT
          export DASHCAM_VERSION_NAME="${GITHUB_REF_NAME#v}"
          export DASHCAM_VERSION_CODE=$(python -c 'import os,re; v=os.environ["DASHCAM_VERSION_NAME"]; assert re.fullmatch(r"\d+\.\d+\.\d+",v); a,b,c=map(int,v.split(".")); assert b<1000 and c<1000; print(a*1000000+b*1000+c)')
          title=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          notes=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" | grep -v 'Co-Authored-By' | sed -e '/./,$!d')
          title=${title:-"${GITHUB_REF_NAME#v} 更新"}
          notes=${notes:-改进行车视频转存}
          python deploy/build_android.py release "$task_dir/app.apk"
          uv run --project deploy deploy/release.py "$task_dir/app.apk"
          # 安装包不作为公开附件（内嵌受限服务凭据）；Release 只挂校验文件与说明。
          sha256sum "$task_dir/app.apk" | sed "s#  .*/#  dashcam-transfer-${DASHCAM_VERSION_NAME}.apk#" > "$task_dir/SHA256SUMS.txt"
          gh release create "$GITHUB_REF_NAME" "$task_dir/SHA256SUMS.txt" \
            --title "$title" --notes "$notes" \
            || gh release edit "$GITHUB_REF_NAME" --notes "$notes"
