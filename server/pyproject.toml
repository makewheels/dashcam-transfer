[project]
name = "dashcam-transfer-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["Flask>=3.1,<4", "gunicorn>=23,<24", "pymongo>=4.10,<5", "oss2>=2.19,<3", "requests>=2.32,<3", "pyOpenSSL>=25.3,<27", "service-identity>=24.2,<25"]

[dependency-groups]
dev = ["pytest>=8,<10", "mongomock>=4.3,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
